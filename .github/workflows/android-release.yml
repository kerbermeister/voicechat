name: Android release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish accepted APK to the configured VPS
        type: boolean
        default: false
      check_channel:
        description: Verify current managed edge channels without publishing
        type: boolean
        default: false
      source_run:
        description: Existing candidate workflow run ID (required when publishing)
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: voicechat-android-release
  cancel-in-progress: false
jobs:
  channel:
    if: ${{ inputs.check_channel && !inputs.publish }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      CLIENT_ROUTE_CONFIG: ${{ vars.CLIENT_ROUTE_CONFIG }}
      CLIENT_ROUTE_CATALOG_KEY: ${{ vars.CLIENT_ROUTE_CATALOG_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check managed channels without an APK or signing key
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          python3 infra/client_config.py --environment "$PUBLIC_URL" /tmp/client.json
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          python3 infra/publish_android_ssh.py --check --config /tmp/client.json
  android:
    if: ${{ !inputs.check_channel || inputs.publish }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      CARGO_BUILD_JOBS: '2'
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      CLIENT_ROUTE_CONFIG: ${{ vars.CLIENT_ROUTE_CONFIG }}
      CLIENT_ROUTE_CATALOG_KEY: ${{ vars.CLIENT_ROUTE_CATALOG_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate version and test
        run: |
          python3 infra/android_release.py check-version
          python3 infra/client_config.py --environment "$PUBLIC_URL" /tmp/client.json
          python3 -c 'import json; assert json.load(open("/tmp/client.json"))["MATRIX_URL"].startswith("https://")'
          python3 prototype/setup.py
          python3 -m pip install -r infra/push-requirements.txt
          python3 -m unittest discover -s prototype -p 'test_*.py'
          cd apps/client
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build and verify signed APK
        if: ${{ inputs.source_run == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE: ${{ runner.temp }}/voicechat-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_SHA256 }}
        run: |
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          data = base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True)
          assert data
          Path(os.environ['ANDROID_KEYSTORE']).write_bytes(data)
          PY
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          rustup toolchain install stable --profile minimal
          python3 - <<'PY'
          import json, subprocess
          expected=json.load(open('infra/crypto-tools.json'))['rust']
          actual=subprocess.check_output(['rustc','+stable','--version'],text=True).split()[1]
          assert actual == expected, 'Cargokit stable toolchain differs from infra/crypto-tools.json; review and pin the release toolchain before building'
          PY
          cd apps/client
          flutter build apk --release --target lib/main.dart --dart-define-from-file /tmp/client.json
          cd ../..
          python3 infra/android_release.py package --apk apps/client/build/app/outputs/flutter-apk/app-release.apk --tools "$ANDROID_HOME/build-tools/36.0.0" --certificate "$SIGNING_SHA256" --output /tmp/android-candidate
          cp /tmp/client.json /tmp/android-candidate/client-config.json
      - name: Retrieve and verify existing candidate without rebuilding
        if: ${{ inputs.source_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_SHA256 }}
        run: |
          python3 -c 'import os; assert os.environ["SOURCE_RUN"].isdigit()'
          gh run download "$SOURCE_RUN" --name "android-$GITHUB_SHA" --dir /tmp/android-original
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          python3 infra/client_config.py --environment --candidate /tmp/android-original/client-config.json "$PUBLIC_URL" /tmp/client.json
          python3 infra/android_release.py package --apk /tmp/android-original/voicechat.apk --tools "$ANDROID_HOME/build-tools/36.0.0" --certificate "$SIGNING_SHA256" --output /tmp/android-candidate
          cp /tmp/client.json /tmp/android-candidate/client-config.json
          python3 - <<'PY'
          import json, os
          original=json.load(open('/tmp/android-original/release.json'))
          assert original['commit'] == os.environ['GITHUB_SHA'] and not original['sourceDirty']
          assert json.load(open('/tmp/android-original/latest.json')) == json.load(open('/tmp/android-candidate/latest.json'))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: android-${{ github.sha }}
          path: /tmp/android-candidate
          retention-days: 30
      - name: Publish accepted candidate on current edges
        if: ${{ inputs.publish }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          ANDROID_ACCEPTED_BUILD: ${{ vars.ANDROID_ACCEPTED_BUILD }}
          ANDROID_ACCEPTED_SHA256: ${{ vars.ANDROID_ACCEPTED_SHA256 }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          test -n "$SOURCE_RUN"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          python3 - <<'PYCODE'
          import json, os, subprocess
          value=json.load(open('/tmp/android-candidate/release.json'))
          assert not value['sourceDirty'], 'Only a clean source revision can be published'
          subprocess.run(['git','fetch','origin','--tags'],check=True)
          tag=value['expectedTag']
          found=subprocess.run(['git','rev-parse','--verify',tag+'^{commit}'],capture_output=True,text=True)
          if found.returncode == 0:
              assert found.stdout.strip() == os.environ['GITHUB_SHA'], 'Release tag already belongs to another revision'
          PYCODE
          python3 infra/publish_android_ssh.py /tmp/android-candidate
          python3 - <<'PYCODE'
          import json, subprocess
          tag=json.load(open('/tmp/android-candidate/release.json'))['expectedTag']
          found=subprocess.run(['git','rev-parse','--verify',tag],capture_output=True)
          if found.returncode != 0: subprocess.run(['git','tag',tag],check=True)
          subprocess.run(['git','push','origin','refs/tags/'+tag],check=True)
          PYCODE
