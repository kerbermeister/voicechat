name: macOS checks and candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voicechat-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      CLIENT_ROUTE_CONFIG: ${{ vars.CLIENT_ROUTE_CONFIG }}
      CLIENT_ROUTE_CATALOG_KEY: ${{ vars.CLIENT_ROUTE_CATALOG_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate host and pinned crypto toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          rustup toolchain install stable --profile minimal
          python3 - <<'PY'
          import json, subprocess
          expected = json.load(open('infra/crypto-tools.json'))['rust']
          actual = subprocess.check_output(['rustc', '+stable', '--version'], text=True).split()[1]
          assert actual == expected, 'Cargokit stable does not match the reviewed crypto toolchain'
          PY
          python3 infra/client_config.py --environment "$PUBLIC_URL" "$RUNNER_TEMP/client.json"
          python3 -m unittest discover -s prototype -p 'test_macos_*.py'
          python3 -m unittest discover -s prototype -p 'test_deploy*.py'
      - name: Analyze and test the shared client
        working-directory: apps/client
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test --concurrency=1
      - name: Verify real Keychain and SQLCipher on a disposable profile
        working-directory: apps/client
        run: flutter test integration_test/macos_storage_test.dart -d macos
      - name: Build release candidate
        working-directory: apps/client
        run: flutter build macos --release --target lib/main.dart --dart-define-from-file "$RUNNER_TEMP/client.json"
      - name: Verify native boundaries
        working-directory: apps/client/macos
        run: xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS,arch=arm64' test
      - name: Package development DMG and ZIP
        run: python3 infra/macos_release.py --app apps/client/build/macos/Build/Products/Release/VoiceChat.app --output "$RUNNER_TEMP/macos-candidate"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-development-${{ github.sha }}
          path: ${{ runner.temp }}/macos-candidate
          retention-days: 14
