name: Check VPS SSH
on:
  workflow_dispatch:
permissions: {}
jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Verify SSH identity and Docker access
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          printf '%s\n' "$SSH_KEY" > "$directory/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$directory/known_hosts"
          ssh -T -i "$directory/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$directory/known_hosts" \
            -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu; id; docker version --format "{{.Server.Version}}"; docker compose version'
