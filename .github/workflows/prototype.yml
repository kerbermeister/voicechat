name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python3 prototype/setup.py
      - run: python3 -m unittest discover -s prototype -p 'test_*.py'
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - run: flutter analyze
        working-directory: apps/client
      - run: flutter test
        working-directory: apps/client
