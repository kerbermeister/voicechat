name: Build bounded A/V WebRTC SDK
on:
  workflow_dispatch:
    inputs:
      tests_only:
        description: Qualify C++ timing before compiling platform libraries
        type: boolean
        default: false
      macos_only:
        description: Build only the macOS SDK
        type: boolean
        default: false
      timing_tests_run:
        description: Reuse exact-source timing evidence from this successful test job's run
        type: string
        default: ''
  push:
    branches: [codex/native-sdk-av-sync]
    paths:
      - infra/build_webrtc_sdk.py
      - infra/webrtc-sdk.json
      - infra/verify_native_playout_policy.py
      - infra/verify_webrtc_timing.py
      - infra/webrtc-bounded-sync.patch
permissions:
  contents: read
  actions: read
concurrency:
  group: webrtc-sdk-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: inputs.timing_tests_run == ''
        with:
          repository: webrtc-sdk/webrtc-build
          ref: 717ec1dc5a94389d691e09cccaf3d7b3364fb4b7
          path: sdk-builder
          persist-credentials: false
      - name: Prepare isolated runner
        if: inputs.timing_tests_run == ''
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ninja-build python3-setuptools rsync libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxtst6 libgbm1
          df -h
      - name: Prove regression and run timing tests
        if: inputs.timing_tests_run == ''
        run: python3 infra/build_webrtc_sdk.py test --builder sdk-builder/build --work "$RUNNER_TEMP/sdk" --output "$RUNNER_TEMP/results"
      - name: Verify reusable native timing evidence
        if: inputs.timing_tests_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TIMING_RUN: ${{ inputs.timing_tests_run }}
        run: |
          [[ "$TIMING_RUN" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh run download "$TIMING_RUN" --repo "$GITHUB_REPOSITORY" --name webrtc-timing-tests --dir "$RUNNER_TEMP/results"
          python3 infra/verify_webrtc_timing.py "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: webrtc-timing-tests
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
  sdk:
    if: inputs.tests_only != true
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos_only && '[{"platform":"macos","os":"macos-26"}]' || '[{"platform":"macos","os":"macos-26"},{"platform":"android","os":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: webrtc-sdk/webrtc-build
          ref: 717ec1dc5a94389d691e09cccaf3d7b3364fb4b7
          path: sdk-builder
          persist-credentials: false
      - name: Read pinned SDK artifact version
        id: sdk_version
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          value = json.load(open('infra/webrtc-sdk.json'))['release_artifact_version']
          assert re.fullmatch(r'[0-9]+(?:\.[0-9]+){2}-vc[1-9][0-9]*', value)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + value + '\n')
          PYTHON
      - name: Prepare isolated Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ninja-build python3-setuptools rsync
          df -h
      - name: Select official builder Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version
          df -h
      - name: Build pinned SDK
        env:
          SDK_PLATFORM: ${{ matrix.platform }}
        run: python3 infra/build_webrtc_sdk.py "$SDK_PLATFORM" --builder sdk-builder/build --work "$RUNNER_TEMP/sdk" --output "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: webrtc-${{ matrix.platform }}-${{ steps.sdk_version.outputs.version }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
