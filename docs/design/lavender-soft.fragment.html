<div id="vc-ref"><div class="viz-dotted-background" aria-label="Lavender Soft — основной визуальный референс VoiceChat">
<section data-variant="Lavender Soft" class="ref-stage soft"></section>
</div></div>
<style>
#vc-ref [hidden]{display:none!important}
#vc-ref *{box-sizing:border-box}#vc-ref .ref-stage{--purple:#8055d7;--light:#aa8df0;--coral:#fa8d83;--bg:#faf8fd;--surface:#fff;--ink:#312940;--sub:#736a81;--line:#eae3f3;--soft:#efe8fb;--on-purple:#fff;min-height:850px;padding:12px 8px 25px;font-family:Arial,sans-serif;color:var(--ink)}#vc-ref .ref-title{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 10px 22px;color:light-dark(#3b3148,#eee5ff)}#vc-ref .ref-title b{font-size:23px;letter-spacing:-.7px}#vc-ref .ref-title small{font-size:11px;color:light-dark(#736a81,#c9bed7)}#vc-ref .phones{display:grid;grid-template-columns:1fr 1fr;gap:25px;max-width:700px;margin:auto}#vc-ref .phone{background:var(--bg);border-radius:36px;overflow:hidden;min-width:0;min-height:670px;display:flex;flex-direction:column;box-shadow:0 12px 28px #39215412;border:1px solid var(--line);position:relative}#vc-ref .phone-top{background:linear-gradient(135deg,var(--light),var(--purple));color:var(--on-purple);padding:18px 22px 40px}#vc-ref .statusbar{display:flex;justify-content:space-between;font-size:11px;margin-bottom:29px}#vc-ref .welcome{display:flex;align-items:center;gap:10px}#vc-ref .welcome>div{flex:1}#vc-ref .welcome b{font-size:20px;line-height:1.15;letter-spacing:-.5px;display:block}#vc-ref .welcome small{font-size:11px;display:block;margin-top:6px}#vc-ref .av{width:43px;height:43px;background:#ece2fa;color:#64469a;border-radius:13px;display:grid;place-items:center;font-size:18px;font-weight:600;flex-shrink:0}#vc-ref .av.peach{background:#f9dcd0;color:#9a5340}#vc-ref .av.blue{background:#dbe4f5;color:#586c9b}#vc-ref .av.mint{background:#dbe9dc;color:#577c60}#vc-ref button,#vc-ref input{font:inherit}#vc-ref button{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:44px;border:0;border-radius:14px;background:var(--soft);color:var(--purple);padding:10px;font-size:12px}#vc-ref svg{width:18px;height:18px;flex-shrink:0}#vc-ref .circle{border-radius:50%;width:44px;padding:10px;flex-shrink:0}#vc-ref .add{background:var(--coral);color:#4b263d}#vc-ref .phone-body{background:var(--bg);border-radius:34px 34px 0 0;margin-top:-25px;padding:23px 20px;position:relative;flex:1;display:flex;flex-direction:column}#vc-ref .tabs{display:flex;gap:7px;margin-bottom:23px}#vc-ref .tabs button{flex:1;min-height:38px;background:var(--surface);color:var(--sub);font-size:11px;padding:8px 5px;box-shadow:0 5px 10px #62438d09}#vc-ref .tabs .selected{background:var(--purple);color:var(--on-purple)}#vc-ref .label{font-size:12px;font-weight:600;letter-spacing:.1px;margin:0 0 13px}#vc-ref .chat-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}#vc-ref .chat-row>div{flex:1;min-width:0}#vc-ref .chat-row b{font-size:13px;font-weight:600;display:block}#vc-ref .chat-row p{font-size:11px;color:var(--sub);margin:7px 0 0;line-height:1.35}#vc-ref .chat-row time{font-size:10px;color:var(--sub)}#vc-ref .voice-tag{background:var(--coral);color:#56303a;border-radius:10px;padding:4px 8px;display:inline-block;font-size:10px;margin-top:6px}#vc-ref .badge{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--purple);color:var(--on-purple);font-size:10px;margin-top:7px}#vc-ref .bottom-nav{display:flex;justify-content:space-around;gap:10px;align-items:center;margin-top:auto;padding:21px 0 0}#vc-ref .bottom-nav button{background:transparent;color:var(--sub)}#vc-ref .bottom-nav .selected{background:var(--purple);color:var(--on-purple);border-radius:50%;width:46px;height:46px;box-shadow:0 5px 12px #8055d733}#vc-ref .dialog .phone-top{background:var(--coral);color:#492f3b}#vc-ref .dialog .welcome b{font-size:17px}#vc-ref .dialog .phone-top button{background:#fff9;color:#644759}#vc-ref .day{text-align:center;font-size:10px;color:#8b623d;background:#ffe2be;border-radius:10px;padding:5px 18px;align-self:center;margin:0 0 22px}#vc-ref .bubble{font-size:12px;line-height:1.5;padding:12px 15px;background:var(--surface);border-radius:18px 18px 18px 5px;max-width:87%;align-self:flex-start;margin-bottom:14px;box-shadow:0 4px 10px #60487906}#vc-ref .bubble.out{background:var(--purple);color:var(--on-purple);align-self:flex-end;border-radius:18px 18px 5px 18px}#vc-ref .time{font-size:10px;color:var(--sub);text-align:right;margin:-7px 0 17px}#vc-ref .voice{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--coral);color:#4c293a;border-radius:15px;min-height:58px;margin-bottom:13px;width:93%}#vc-ref .voice.out{background:var(--purple);color:var(--on-purple);align-self:flex-end}#vc-ref .voice button{background:#ffffffc9;color:#624486;width:34px;height:34px;min-height:34px;padding:8px;border-radius:50%;flex-shrink:0}#vc-ref .voice small{font-size:10px}#vc-ref .wave{display:flex;align-items:center;gap:2px;height:27px;flex:1;min-width:25px}#vc-ref .wave b{background:currentColor;width:2px;flex:1;max-width:3px;border-radius:3px}#vc-ref .composer{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:20px}#vc-ref .composer input{flex:1;min-width:0;width:30px;background:transparent;border:0;padding:10px 3px;font-size:11px;color:var(--ink)}#vc-ref .composer input::placeholder{color:var(--sub)}#vc-ref .composer button:last-child{background:#292033;color:#fff}#vc-ref .feedback{padding:16px 10px;color:light-dark(#736a81,#c9bed7);font-size:11px;min-height:42px}#vc-ref .mini-contacts{display:none}#vc-ref .cover-call{display:none}#vc-ref .floating-voice{display:none}
@media(max-width:600px){#vc-ref .phones{grid-template-columns:1fr;max-width:345px;gap:22px}#vc-ref .ref-stage{min-height:1550px}#vc-ref .phone{min-height:670px}#vc-ref .ref-title{display:grid;justify-content:center;text-align:center;padding-bottom:22px}#vc-ref .composer input{font-size:16px}#vc-ref .voice button{width:44px;height:44px;min-height:44px}#vc-ref .feedback{text-align:center}}
</style>
<script>
(()=>{const root=document.getElementById('vc-ref');const I=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;const button=(label,cls='',note='')=>`<button type="button" class="cursor-interaction ${cls}" aria-label="${note||label.replace(/<[^>]*>/g,'')||'Действие'}" data-note="${note||'Предпросмотр действия'}">${label}</button>`;const av=(name,cls='')=>`<span class="av ${cls}">${name[0]}</span>`;const wave=()=>`<span class="wave" aria-label="Звуковая дорожка">${[8,15,22,13,26,19,12,21,28,14,8,19,25,11,17,26,14,21,10,18,24,12,7,17,22,11,15,24].map(h=>`<b style="height:${h}px"></b>`).join('')}</span>`;const voice=(out,time)=>`<div class="voice ${out?'out':''}">${button(I('play'),'','Голосовое выбрано · аудиозапись в эскизе отсутствует')}${wave()}<small>${time}</small></div>`;const statusbar=()=>`<div class="statusbar"><span>9:41</span><span>● ▰</span></div>`;const titles=[['Lavender Soft','Основной визуальный референс VoiceChat']];root.querySelectorAll('.ref-stage').forEach((s,i)=>{s.setAttribute('aria-label',titles[i][0]);s.innerHTML=`<div class="ref-title"><b>${titles[i][0]}</b><small>${titles[i][1]}</small></div><div class="phones"><article class="phone home" aria-label="Список переписок"><div class="phone-top">${statusbar()}<div class="welcome">${av('Антон')}<div><b>Привет,<br>Антон!</b><small>Хороший день для разговора</small></div>${button(I('plus'),'circle add','Начать новый разговор')}</div></div><div class="phone-body"><div class="tabs">${button('Чаты','selected','Показаны все чаты')}${button('Группы','','Показаны групповые чаты')}${button('Новые','','Показаны непрочитанные')}</div><div class="mini-contacts">${av('Мама','peach')}${av('Папа','blue')}${av('Аня','mint')}${av('Друзья')}</div><div class="cover-call"><small>СЕМЬЯ · 4 УЧАСТНИКА</small><b>Услышать своих</b>${button(I('phone')+' Позвонить','','Исходящий звонок семье')}</div><p class="label">Недавние разговоры</p><div class="chat-list">${[['Мама','Ждём вас в воскресенье ❤️','14:35','peach'],['Семья','Голосовое сообщение','14:30',''],['Алексей','Давай созвонимся вечером','13:42','blue'],['Аня','Спасибо за фотографии!','Вчера','mint']].map((a,j)=>`<div class="chat-row" data-group="${j===1}" data-unread="${j<2}">${av(a[0],a[3])}<div><b>${a[0]}</b>${j===1?'<span class="voice-tag">Голосовое · 0:18</span>':`<p>${a[1]}</p>`}</div><span><time>${a[2]}</time>${j<2?'<span class="badge">1</span>':''}</span></div>`).join('')}</div><nav class="bottom-nav" aria-label="Навигация">${button(I('users'),'','Контакты')}${button(I('message-circle'),'selected','Переписки')}${button(I('phone'),'','История звонков')}</nav></div></article><article class="phone dialog" aria-label="Переписка с мамой"><div class="phone-top">${statusbar()}<div class="welcome">${button(I('chevron-left'),'circle','Вернуться к чатам')}${av('Мама','peach')}<div><b>Мама</b><small>В сети</small></div>${button(I('phone'),'circle','Позвонить маме')}</div></div><div class="phone-body"><span class="day">Сегодня</span><div class="bubble">В воскресенье собираемся у нас? ❤️</div><div class="bubble out">Конечно! Давайте в пять.<br>Я привезу десерт.</div><div class="time">14:34 · Прочитано</div>${voice(false,'0:18')}${voice(true,'0:09')}<div class="time">14:35</div><div class="bubble">Договорились 😊</div><form class="composer">${button(I('plus'),'circle','Прикрепить изображение')}<input placeholder="Написать…" aria-label="Сообщение маме">${button(I('mic'),'circle','Записать голосовое')}<button class="circle" type="submit" aria-label="Отправить сообщение">${I('arrow-up')}</button></form></div></article></div><div class="feedback" aria-live="polite">Основной визуальный референс · не спецификация реализации</div>`;s.querySelectorAll('[data-note]').forEach(b=>b.addEventListener('click',()=>s.querySelector('.feedback').textContent='Эскиз: '+b.dataset.note));s.querySelectorAll('.tabs button').forEach((b,k)=>b.addEventListener('click',()=>{s.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');s.querySelectorAll('.chat-row').forEach(row=>{row.hidden=k===1?row.dataset.group!=='true':k===2?row.dataset.unread!=='true':false;});}));s.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const input=s.querySelector('input');if(input.value.trim()){s.querySelector('.feedback').textContent='Эскиз отправки: '+input.value;input.value='';}});});root.querySelectorAll('form button[type="submit"]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();b.closest('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}));if(globalThis.lucide)lucide.createIcons();})();
</script>
