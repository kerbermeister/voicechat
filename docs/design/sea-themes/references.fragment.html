<script>
(()=>{const root=document.getElementById('sea-vc');const I=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;const btn=(icon,label,cls='')=>`<button type="button" class="cursor-interaction ${cls}" aria-label="${label}" data-action="${label}">${I(icon)}</button>`;const concepts=[['Лагуна', 'Бирюза + песок · островки переписок', 'shell', 'Близкие берега', '#087e86', '#5ccbc5', '#ffe2ad'], ['Коралловый риф', 'Тёплый коралл + водоросли · органические формы', 'fish', 'Море разговоров', '#ab4d59', '#eb9d94', '#7ac6bd'], ['Биолюминесценция', 'Ночной океан + свечение · светящиеся дорожки', 'sparkles', 'Голоса в глубине', '#79e2d3', '#17243e', '#bf99f7'], ['Закат в бухте', 'Абрикос + лиловый · горизонт и тёплые переливы', 'sun', 'Разговор до заката', '#8b5b9d', '#e59d9b', '#ffd3a1']];const sea=c=>`<div class="seascape" aria-hidden="true"><span class="sea-sun"></span><span class="sea-wave"></span><span class="sea-wave second"></span><span class="sea-mark">${I(c[2])}</span></div>`;const status=()=>'<div class="statusbar"><span>9:41</span><span>● ▰</span></div>';const voice=(out,time)=>`<div class="voice ${out?'out':''}">${btn('play','Прослушать голосовое')}<div class="sound" aria-label="Голосовое сообщение">${[8,12,18,26,20,12,8,17,24,28,19,10,15,22,27,18,9,14,23,16,8].map(h=>`<b style="height:${h}px"></b>`).join('')}</div><small>${time}</small></div>`;
root.querySelectorAll('.stage').forEach((s,i)=>{const c=concepts[i];s.setAttribute('aria-label',c[0]);s.innerHTML=`<div class="caption"><div><b>${c[0]}</b><small>${c[1]}</small></div><div class="palette" aria-label="Палитра">${c.slice(4).map(x=>`<span style="background:${x}"></span>`).join('')}</div></div><div class="screens"><article class="phone home" aria-label="Список чатов"><div class="top">${sea(c)}${status()}<div class="hello"><div><h3>Привет, Антон!</h3><small>${c[3]}</small></div>${btn('plus','Новый разговор','circle')}</div><div class="decor-tag">voicechat / sea collection</div></div><div class="body"><nav class="filters" aria-label="Фильтр чатов"><button class="selected" aria-pressed="true">Все</button><button aria-pressed="false">Группы</button><button aria-pressed="false">Новые</button></nav><div class="section-name">${I(c[2])} Ваши разговоры</div>${[['Мама','Ждём вас в воскресенье ❤️','14:35'],['Семья','Голосовое сообщение','14:30'],['Алексей','Пойдём вечером к морю?','13:42'],['Аня','Спасибо за фотографии!','Вчера']].map((a,j)=>`<div class="contact" data-group="${j===1}" data-new="${j<2}"><span class="avatar">${a[0][0]}</span><div><b>${a[0]}</b>${j===1?'<span class="voice-label">Голосовое · 0:18</span>':`<p>${a[1]}</p>`}</div><span><time>${a[2]}</time>${j<2?'<span class="unread">1</span>':''}</span></div>`).join('')}<nav class="nav" aria-label="Разделы"><button data-action="Контакты">${I('users')}Контакты</button><button class="selected" data-action="Чаты">${I('message-circle')}Чаты</button><button class="open-call">${I('phone')}Звонки</button></nav></div></article><article class="phone dialog" aria-label="Переписка и звонок"><div class="top">${sea(c)}${status()}<div class="hello">${btn('chevron-left','Назад к переписке','circle back')}<span class="avatar">М</span><div><h3>Мама</h3><small>В сети</small></div>${btn('phone','Позвонить маме','circle open-call')}</div></div><div class="body"><div class="chat-content"><span class="day">Сегодня</span><div class="bubble">Слышишь, как шумит море? 🌊</div><div class="bubble out">Да! Как будто снова<br>рядом с вами.</div><span class="time">14:34 · Прочитано</span>${voice(false,'0:18')}${voice(true,'0:09')}<span class="time">14:35</span><div class="bubble">Вечером созвонимся ❤️</div><form class="composer">${btn('plus','Прикрепить изображение','circle')}<input aria-label="Сообщение маме" placeholder="Написать…">${btn('mic','Записать голосовое','circle')}<button type="button" class="circle send" aria-label="Отправить">${I('arrow-up')}</button></form></div><div class="call-content" hidden><small>ГОЛОСОВОЙ ЗВОНОК</small><div class="call-avatar">М</div><h3>Мама</h3><small class="call-status">На связи · 04:32</small><div class="call-controls"><button class="circle mute" aria-label="Выключить микрофон" aria-pressed="false">${I('mic')}</button>${btn('volume-2','Выбрать аудиоустройство','circle')}</div><button class="end">${I('phone-off')} Завершить</button></div></div></article></div><div class="footnote" aria-live="polite">Предварительный референс темы · основной стиль: Lavender Soft</div>`;
const feedback=s.querySelector('.footnote');s.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{feedback.textContent=b.dataset.action==='Прослушать голосовое'?'Эскиз голосового сообщения · демонстрационная запись отсутствует':'Эскиз: '+b.dataset.action;}));s.querySelectorAll('.filters button').forEach((b,j)=>b.addEventListener('click',()=>{s.querySelectorAll('.filters button').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false');});b.classList.add('selected');b.setAttribute('aria-pressed','true');s.querySelectorAll('.contact').forEach(row=>row.hidden=j===1?row.dataset.group!=='true':j===2?row.dataset.new!=='true':false);}));const showCall=on=>{s.querySelector('.chat-content').hidden=on;s.querySelector('.call-content').hidden=!on;feedback.textContent=on?'Эскиз звонка · микрофон и возврат в переписку доступны':'Эскиз переписки';};s.querySelectorAll('.open-call').forEach(b=>b.addEventListener('click',()=>showCall(true)));s.querySelector('.back').addEventListener('click',()=>showCall(false));s.querySelector('.end').addEventListener('click',()=>{showCall(false);feedback.textContent='Эскиз: звонок завершён';});s.querySelector('.mute').addEventListener('click',e=>{const b=e.currentTarget;const muted=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(muted));b.setAttribute('aria-label',muted?'Включить микрофон':'Выключить микрофон');b.innerHTML=I(muted?'mic-off':'mic');s.querySelector('.call-status').textContent=muted?'Микрофон выключен':'На связи · 04:32';if(globalThis.lucide)lucide.createIcons();});const form=s.querySelector('form');const send=()=>{const input=form.querySelector('input');if(input.value.trim()){feedback.textContent='Эскиз отправки: '+input.value.trim();input.value='';}};form.addEventListener('submit',e=>{e.preventDefault();send();});s.addEventListener('click',e=>{if(e.target.closest('.send')){e.preventDefault();send();}});if(globalThis.Tweak){const state={accent:c[4]};const tweak=new Tweak({container:s,onChange:()=>s.style.setProperty('--a',state.accent)});tweak.addColorPicker(state,'accent',{label:'Основной акцент',reference:'--a'});}});if(globalThis.lucide)lucide.createIcons();})();
</script>
