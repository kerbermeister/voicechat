<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VoiceChat — локальный прототип защищённого общения">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VoiceChat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VoiceChat</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">
  <style>
    body { margin: 0; background: #f3f0fb; }
    #startup { position: fixed; inset: 0; display: grid; place-content: center;
      padding: 24px; text-align: center; font: 16px/1.5 system-ui, sans-serif;
      color: #302c3b; background: #f3f0fb; z-index: 1; }
    #startup h1 { font-size: 24px; margin: 0 0 12px; }
    #startup p { max-width: 32em; margin: 0 0 20px; }
    #startup button { min-height: 48px; padding: 12px 24px; border: 0;
      border-radius: 16px; background: #7854cd; color: white;
      font: inherit; cursor: pointer; }
    #startup button:focus-visible { outline: 3px solid #302c3b; outline-offset: 4px; }
  </style>
</head>
<body>
  <div id="startup">
    <h1>VoiceChat</h1>
    <p id="startup-status" role="status" aria-live="polite">Открываем приложение…</p>
    <button id="startup-retry" hidden>Повторить загрузку</button>
    <noscript>Для работы VoiceChat включите JavaScript в браузере.</noscript>
  </div>
  <script>
    (() => {
      const shell = document.getElementById('startup');
      const status = document.getElementById('startup-status');
      const retry = document.getElementById('startup-retry');
      const mark = name => window.performance?.mark?.('voicechat-' + name);
      mark('shell');
      let finished = false;
      let failed = false;
      const slow = setTimeout(() => {
        if (finished || failed) return;
        status.textContent = 'Загрузка занимает больше времени. Проверьте подключение к интернету.';
        retry.hidden = false;
      }, 15000);
      retry.addEventListener('click', () => window.location.reload());
      window.voicechatStartup = {
        mark,
        stage(message) { if (!finished && !failed) status.textContent = message; },
        fail() {
          if (finished) return;
          failed = true;
          clearTimeout(slow);
          status.textContent = 'Не удалось загрузить приложение. Проверьте подключение и попробуйте снова.';
          retry.hidden = false;
        },
      };
      window.addEventListener('error', () => window.voicechatStartup.fail(), true);
      // runApp resolves before Flutter paints; keep the shell until the actual first frame.
      window.addEventListener('flutter-first-frame', () => {
        finished = true;
        mark('first-frame');
        clearTimeout(slow);
        shell.remove();
      }, {once: true});
    })();
  </script>
  <script src="vault.js" defer></script>
  <script src="files.js" defer></script>
  <script src="media_audio.js" defer></script>
  <script src="push_client.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
