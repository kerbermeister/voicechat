name: voicechat_probe
description: "VoiceChat Android/web E2EE prototype."
publish_to: 'none'

version: 1.14.0+26

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  matrix:
    path: ../../vendor/matrix
  flutter_vodozemac: ^0.9.0
  livekit_client: ^2.13.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  crypto: ^3.0.7
  http: ^1.6.0
  web: ^1.1.1
  vodozemac: ^0.9.0
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.2.0
  image: ^4.12.0
  record: ^7.1.2
  audioplayers: ^6.8.1
  flutter_webrtc: ^1.6.2+hotfix.4
  camera_platform_interface: ^2.15.0
  camera: ^0.12.1
  video_player: ^2.14.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0

  dart_webrtc: any
  markdown: any
dependency_overrides:
  # crypto 3.0.7 uses 32-bit rounding for final padding in dart2js (>4 GiB fails).
  crypto:
    path: ../../vendor/crypto

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

# Matrix's optional sqlite3 backend is unused by our SQLCipher-backed native
# store. Its prebuilt macOS binary requires 13; use the OS library only for that
# optional backend, keeping sqflite_sqlcipher and all other platforms unchanged.
hooks:
  user_defines:
    sqlite3:
      source:
        macos: system
        default: sqlite3

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
  assets:
    - assets/branding/
    - assets/sounds/
    - assets/verification/
